<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sketchbook Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EAE8E2;
    --surface:#FFFFFF;
    --ink:#1B1B18;
    --ink-soft:#6B6862;
    --accent:#45564C;
    --line:#D3D0C7;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding:48px 24px 64px;
  }
  .header{ text-align:center; max-width:560px; margin:0 auto 44px; }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.14em;
    text-transform:uppercase; color:var(--ink-soft); margin:0 0 8px;
  }
  h1{
    font-family:'Fraunces',serif; font-weight:500; font-size:34px;
    letter-spacing:-0.01em; margin:0; color:var(--ink);
  }
  .subtitle{
    font-family:'Inter',sans-serif; font-size:14px; line-height:1.6;
    color:var(--ink-soft); margin:14px 0 0;
  }

  .grid{
    max-width:1040px;
    margin:0 auto;
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(220px, 1fr));
    gap:22px;
  }

  .card{
    background:var(--surface);
    border-radius:3px;
    overflow:hidden;
    cursor:pointer;
    box-shadow:0 1px 2px rgba(27,27,24,0.05), 0 8px 20px rgba(27,27,24,0.06);
    transition:transform 0.15s ease, box-shadow 0.15s ease;
    text-decoration:none;
    color:inherit;
    display:block;
  }
  .card:hover{ transform:translateY(-3px); box-shadow:0 10px 26px rgba(27,27,24,0.14); }
  .card-thumb{
    width:100%;
    aspect-ratio:8.5/5.5;
    background:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  .card-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .card-thumb .initials{
    font-family:'Fraunces',serif; font-size:30px; color:#EAE8E2; opacity:0.7;
  }
  .card-body{ padding:14px 16px 16px; }
  .card-name{ font-family:'Fraunces',serif; font-weight:500; font-size:17px; margin:0; }
  .card-meta{
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:0.05em;
    text-transform:uppercase; color:var(--ink-soft); margin:6px 0 0;
  }

  .empty-state{
    max-width:360px; margin:60px auto 0; text-align:center;
    font-family:'Inter',sans-serif; font-size:13.5px; color:var(--ink-soft); line-height:1.6;
  }
</style>
</head>
<body>

<div class="header">
  <p class="eyebrow">Sketchbook Archive</p>
  <h1>Sketchbook Archive</h1>
  <p class="subtitle">A free, open collection of sketchbooks from architects and students, so you can see how they think — page by page, from anywhere in the world.</p>
</div>

<div class="grid" id="grid"></div>
<div class="empty-state" id="emptyState" style="display:none;">No sketchbooks added yet. Check back soon.</div>

<script>
async function loadRegistry(){
  const grid = document.getElementById('grid');
  const emptyState = document.getElementById('emptyState');
  let books = [];
  try{
    const res = await fetch('registry.json', { cache: 'no-store' });
    const data = await res.json();
    books = data.books || [];
  }catch(e){
    console.error('Could not load registry.json', e);
  }

  if(books.length === 0){
    emptyState.style.display = 'block';
    return;
  }

  books.forEach(book => {
    const card = document.createElement('a');
    card.className = 'card';
    card.href = 'book.html?book=' + encodeURIComponent(book.id);

    const initials = (book.owner || book.id || '?').trim().split(/\s+/).map(w => w[0]).join('').slice(0,2).toUpperCase();
    const thumb = book.coverThumb
      ? `<img src="${book.coverThumb}" alt="${book.owner || book.id}">`
      : `<span class="initials">${initials}</span>`;

    card.innerHTML = `
      <div class="card-thumb">${thumb}</div>
      <div class="card-body">
        <p class="card-name">${book.owner || book.id}</p>
        <p class="card-meta">${book.location || book.title || 'Sketchbook'}</p>
      </div>
    `;
    grid.appendChild(card);
  });
}

loadRegistry();
</script>
</body>
</html>
